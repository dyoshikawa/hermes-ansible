[project]
name = "hermes-ansible"
version = "0.1.0"
description = "Ansible playbook that installs Hermes Agent on an Ubuntu LTS VPS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "ansible-core>=2.19,<2.20",
]

[dependency-groups]
dev = [
  "ansible-lint>=25.0",
  "yamllint>=1.35",
]

[tool.uv]
package = false
