[tools]
python = "3.13"
uv = "0.13.1"
# GitHub Actions tooling, resolved through the aqua registry backend. Versions
# are pinned so CI and local runs use the same, reviewed binaries.
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:suzuki-shunsuke/pinact" = "5.0.0"
"aqua:gitleaks/gitleaks" = "8.30.1"

[tasks.install]
description = "Install Ansible and the linters into .venv"
run = "uv sync"

[tasks.lint]
description = "Run yamllint and ansible-lint"
run = ["uv run yamllint .", "uv run ansible-lint"]

[tasks.syntax]
description = "Syntax-check the playbook against the example inventory"
run = "uv run ansible-playbook -i inventory/hosts.example.yml site.yml --syntax-check"

[tasks.secrets]
description = "Scan the working tree and git history for leaked secrets (public repository)"
run = "gitleaks git --no-banner --redact ."

[tasks.check]
description = "Everything CI runs: lint, syntax check, secret scan, actionlint, pinact"
depends = ["lint", "syntax", "secrets", "actionlint", "pinact:check"]

[tasks.actionlint]
description = "Lint GitHub Actions workflows"
run = "actionlint -color"

[tasks.pinact]
description = "Pin GitHub Actions to full-length commit SHAs"
run = "pinact run"

[tasks."pinact:check"]
description = "Fail when a GitHub Action is not pinned to a commit SHA"
run = "pinact run --check"
