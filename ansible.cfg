[defaults]
inventory = inventory/hosts.yml
roles_path = roles
interpreter_python = auto_silent
stdout_callback = ansible.builtin.default
result_format = yaml
host_key_checking = True
retry_files_enabled = False
# Modules of become_user tasks run as the service account and could return
# forged facts; keep facts under ansible_facts so they cannot override role
# variables (e.g. hermes_agent_user) for the root tasks that follow.
inject_facts_as_vars = False

[privilege_escalation]
become = True
become_method = sudo
