---
- name: Check whether the gateway unit is installed
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ hermes_agent_gateway_service_name }}.service"
  register: hermes_agent_gateway_unit

# `hermes gateway install --system` must run as root; it writes the unit with
# User=/Group= of the service account and HERMES_HOME under its home. Root's own
# ~/.hermes is only touched for the CLI bootstrap, never by the gateway.
- name: Install the gateway as a system service
  ansible.builtin.command:
    argv:
      - "{{ hermes_agent_launcher }}"
      - gateway
      - install
      - --system
      - --run-as-user
      - "{{ hermes_agent_user }}"
      - --start-on-login
      - --no-start-now
  environment:
    HOME: /root
    PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  when: not hermes_agent_gateway_unit.stat.exists
  changed_when: true

- name: Manage the gateway service
  ansible.builtin.systemd_service:
    name: "{{ hermes_agent_gateway_service_name }}"
    enabled: true
    state: "{{ hermes_agent_gateway_state }}"
    daemon_reload: true
