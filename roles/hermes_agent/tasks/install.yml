---
# With a checksum, get_url re-downloads only when the file on disk does not
# match it, and fails before anything runs when the download does not either.
- name: Download the official installer
  ansible.builtin.get_url:
    url: "{{ hermes_agent_installer_url }}"
    dest: "{{ hermes_agent_home }}/.hermes-install.sh"
    checksum: "{{ hermes_agent_installer_checksum }}"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_group }}"
    mode: "0700"
    force: "{{ hermes_agent_update | bool and hermes_agent_installer_checksum | length == 0 }}"
  become: true
  become_user: "{{ hermes_agent_user }}"

- name: Build the installer arguments
  ansible.builtin.set_fact:
    hermes_agent_installer_args: >-
      {{
        ['--skip-setup', '--branch', hermes_agent_branch]
        + (['--skip-browser'] if not hermes_agent_install_browser | bool else [])
        + (['--skip-computer-use'] if not hermes_agent_install_computer_use | bool else [])
        + (['--commit', hermes_agent_commit] if hermes_agent_commit | length > 0 else [])
        + (['--force-commit'] if hermes_agent_force_commit | bool else [])
        + hermes_agent_installer_extra_args
      }}

- name: Check for an existing install
  ansible.builtin.stat:
    path: "{{ hermes_agent_launcher }}"
  register: hermes_agent_launcher_stat

- name: Read the installed commit
  ansible.builtin.command:
    argv: [git, -C, "{{ hermes_agent_install_dir }}", rev-parse, HEAD]
  become: true
  become_user: "{{ hermes_agent_user }}"
  register: hermes_agent_installed_commit
  changed_when: false
  failed_when: false
  when:
    - hermes_agent_commit | length > 0
    - hermes_agent_launcher_stat.stat.exists

# The installer is idempotent for an existing checkout (it pulls the branch and
# re-syncs the dependencies), so re-running it is how updates are applied — on request,
# or when the checkout is not at the pinned commit.
- name: Run the installer as the service account
  ansible.builtin.command:
    argv: "{{ ['bash', hermes_agent_home + '/.hermes-install.sh'] + hermes_agent_installer_args }}"
  args:
    chdir: "{{ hermes_agent_home }}"
  environment:
    HOME: "{{ hermes_agent_home }}"
    HERMES_HOME: "{{ hermes_agent_hermes_home }}"
    PATH: "{{ hermes_agent_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
  become: true
  become_user: "{{ hermes_agent_user }}"
  when: >-
    hermes_agent_update | bool
    or not hermes_agent_launcher_stat.stat.exists
    or (hermes_agent_commit | length > 0
        and hermes_agent_installed_commit.stdout | default('') | trim != hermes_agent_commit)
  register: hermes_agent_install_result
  changed_when: true
  notify: Restart hermes gateway

- name: Confirm the launcher exists
  ansible.builtin.stat:
    path: "{{ hermes_agent_launcher }}"
  register: hermes_agent_launcher_stat
  failed_when: not hermes_agent_launcher_stat.stat.exists

# `uv pip install --editable` reinstalls the package on every run, so the extras
# are keyed on the lockfile checksum and re-applied only when that or the list changes.
- name: Checksum the lockfile the extras resolve against
  ansible.builtin.stat:
    path: "{{ hermes_agent_install_dir }}/uv.lock"
  register: hermes_agent_lockfile
  when: hermes_agent_extras | length > 0

- name: Record which extras are installed
  ansible.builtin.copy:
    content: "{{ hermes_agent_extras | sort | join(',') }} {{ hermes_agent_lockfile.stat.checksum | default('') }}\n"
    dest: "{{ hermes_agent_hermes_home }}/.ansible-extras"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_group }}"
    mode: "0600"
  become: true
  become_user: "{{ hermes_agent_user }}"
  register: hermes_agent_extras_stamp
  when: hermes_agent_extras | length > 0

# PM owns the dependency environment; `hermes pm install --extra` adds the
# extras to it and records them so later updates keep them.
- name: Pre-install optional Python extras
  ansible.builtin.command:
    argv: >-
      {{ [hermes_agent_launcher, 'pm', 'install']
         + hermes_agent_extras | map('regex_replace', '^', '--extra=') | list }}
  args:
    chdir: "{{ hermes_agent_install_dir }}"
  environment:
    HOME: "{{ hermes_agent_home }}"
    HERMES_HOME: "{{ hermes_agent_hermes_home }}"
  become: true
  become_user: "{{ hermes_agent_user }}"
  when:
    - hermes_agent_extras | length > 0
    - hermes_agent_extras_stamp is changed
  changed_when: true
  notify: Restart hermes gateway

# Earlier versions of this role symlinked /usr/local/bin/hermes straight to the
# launcher, which let the service account run code as whoever invoked it.
- name: Inspect /usr/local/bin/hermes
  ansible.builtin.stat:
    path: /usr/local/bin/hermes
  register: hermes_agent_system_command_stat

- name: Remove the old symlink to the launcher
  ansible.builtin.file:
    path: /usr/local/bin/hermes
    state: absent
  when: hermes_agent_system_command_stat.stat.islnk | default(false)

- name: Install the root-owned hermes wrapper
  ansible.builtin.template:
    src: hermes-wrapper.sh.j2
    dest: /usr/local/bin/hermes
    owner: root
    group: root
    mode: "0755"
  when: hermes_agent_system_command | bool

- name: Remove the hermes wrapper
  ansible.builtin.file:
    path: /usr/local/bin/hermes
    state: absent
  when: not hermes_agent_system_command | bool

- name: Report the installed version
  ansible.builtin.command:
    argv: ["{{ hermes_agent_launcher }}", "--version"]
  environment:
    HOME: "{{ hermes_agent_home }}"
    HERMES_HOME: "{{ hermes_agent_hermes_home }}"
  become: true
  become_user: "{{ hermes_agent_user }}"
  register: hermes_agent_version
  changed_when: false

- name: Show the installed version
  ansible.builtin.debug:
    msg: "{{ hermes_agent_version.stdout_lines }}"
