---
- name: Assert the host runs a supported Ubuntu LTS
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == "Ubuntu"
      - ansible_facts['distribution_version'] in hermes_agent_supported_releases
    fail_msg: >-
      hermes_agent supports Ubuntu {{ hermes_agent_supported_releases | join(' / ') }},
      found {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}.
      Set hermes_agent_check_distribution=false to override.
  when: hermes_agent_check_distribution | bool

- name: Assert the gateway can be managed by systemd
  ansible.builtin.assert:
    that:
      - ansible_facts['service_mgr'] == "systemd"
    fail_msg: >-
      hermes_agent_gateway_enabled needs systemd, found {{ ansible_facts['service_mgr'] }}.
  when: hermes_agent_gateway_enabled | bool

- name: Refuse to run the service as root
  ansible.builtin.assert:
    that:
      - hermes_agent_user != "root"
    fail_msg: Hermes Agent must be installed under an unprivileged account; set hermes_agent_user.

- name: Refuse an installer that is not checksum-verified
  ansible.builtin.assert:
    that:
      - hermes_agent_installer_checksum | length > 0 or hermes_agent_installer_allow_unverified | bool
    fail_msg: >-
      hermes_agent_installer_checksum is empty, so the installer would run unverified.
      Set it to the sha256 of hermes_agent_installer_url, or set
      hermes_agent_installer_allow_unverified=true to accept that risk.
