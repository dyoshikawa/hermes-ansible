---
- name: Ensure the data directory exists
  ansible.builtin.file:
    path: "{{ hermes_agent_hermes_home }}"
    state: directory
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_group }}"
    mode: "0700"

- name: Write .env from hermes_agent_env
  ansible.builtin.template:
    src: env.j2
    dest: "{{ hermes_agent_hermes_home }}/.env"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_group }}"
    mode: "0600"
  no_log: true
  when: hermes_agent_env_exclusive | bool
  notify: Restart hermes gateway

- name: Merge hermes_agent_env into .env
  ansible.builtin.lineinfile:
    path: "{{ hermes_agent_hermes_home }}/.env"
    regexp: "^{{ item.key }}="
    line: >-
      {{ item.key }}={{ item.value | string
        if item.value | string is match(hermes_agent_env_plain_pattern)
        else item.value | string | to_json }}
    create: true
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_group }}"
    mode: "0600"
  loop: "{{ hermes_agent_env | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true
  when: not hermes_agent_env_exclusive | bool
  notify: Restart hermes gateway

- name: Read the current config.yaml
  ansible.builtin.slurp:
    src: "{{ hermes_agent_hermes_home }}/config.yaml"
  register: hermes_agent_config_current
  failed_when: false
  when: hermes_agent_config | length > 0

- name: Merge hermes_agent_config into config.yaml
  ansible.builtin.copy:
    content: >-
      {{ ((hermes_agent_config_current.content | default('') | b64decode | from_yaml) or {})
         | combine(hermes_agent_config, recursive=True)
         | to_nice_yaml(indent=2, sort_keys=False) }}
    dest: "{{ hermes_agent_hermes_home }}/config.yaml"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_group }}"
    mode: "0600"
  when: hermes_agent_config | length > 0
  notify: Restart hermes gateway
