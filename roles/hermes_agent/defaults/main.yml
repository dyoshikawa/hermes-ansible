---
# Unprivileged account that owns the Hermes install and runs the gateway.
hermes_agent_user: hermes
hermes_agent_group: "{{ hermes_agent_user }}"
hermes_agent_home: "/home/{{ hermes_agent_user }}"
# Extra groups for the service account (e.g. ["docker"] when terminal.backend is docker).
hermes_agent_user_groups: []

# Data directory (config.yaml, .env, sessions, logs) and the git checkout the
# official installer creates for a per-user install.
hermes_agent_hermes_home: "{{ hermes_agent_home }}/.hermes"
hermes_agent_install_dir: "{{ hermes_agent_hermes_home }}/hermes-agent"
# Launcher the installer publishes inside the checkout (it runs PM's store Python).
hermes_agent_launcher: "{{ hermes_agent_install_dir }}/.hermes/bin/hermes"

# hermes-agent commit to install (default: the v0.22.2 release), as a full
# 40-character SHA. The installer checks it out detached; it must be reachable
# from hermes_agent_branch. The
# installer refuses to roll an existing install back unless
# hermes_agent_force_commit is true. "" follows the tip of the branch instead,
# which is not reproducible and needs hermes_agent_installer_checksum: "".
hermes_agent_branch: main
hermes_agent_commit: d923a5eb487a17c0a68801bba9ef0f56c81040a8
hermes_agent_force_commit: false

# Official installer, fetched from the same commit so the script and the code it
# installs move together. The checksum covers install.sh itself; what it fetches
# afterwards (uv, Python, Node.js, PyPI wheels) is verified by the installer and
# uv.lock hashes, not by this role. It is checked before the script runs; when
# you change hermes_agent_commit, update it with:
#   curl -fsSL "<hermes_agent_installer_url>" | sha256sum
hermes_agent_installer_url: >-
  https://raw.githubusercontent.com/NousResearch/hermes-agent/{{
  hermes_agent_commit if hermes_agent_commit | length > 0 else hermes_agent_branch }}/scripts/install.sh
hermes_agent_installer_checksum: "sha256:f4cdb0e20f1aca2c3871a76b962fd4db61510f549cf973759c753ac13349beb5"
# An empty checksum is refused unless this is true — it means running whatever
# the URL serves at that moment as the service account.
hermes_agent_installer_allow_unverified: false
# Re-run the installer on every play. With a pinned commit this repairs the
# install in place; with hermes_agent_commit: "" it pulls the branch tip.
hermes_agent_update: false
# Playwright/Chromium and the Computer Use driver are pointless on a headless VPS.
hermes_agent_install_browser: false
hermes_agent_install_computer_use: false
hermes_agent_installer_extra_args: []
# Optional extras from hermes-agent's pyproject to pre-install,
# e.g. ["messaging"] for Telegram/Discord/Slack. Hermes lazy-installs them on
# first use anyway; pre-installing keeps the first gateway start offline-safe.
hermes_agent_extras: []

# Refuse to run on anything but a supported Ubuntu LTS.
hermes_agent_check_distribution: true
hermes_agent_supported_releases: ["24.04", "26.04"]

# apt packages the installer needs (it downloads Node.js as a .tar.xz archive),
# ripgrep (which the installer would otherwise try to apt-install with sudo) and
# acl, which Ansible needs to become the unprivileged service account.
hermes_agent_apt_packages:
  - acl
  - ca-certificates
  - curl
  - git
  - ripgrep
  - xz-utils
# Add e.g. ffmpeg (voice/TTS conversion) or build-essential here.
hermes_agent_extra_apt_packages: []

# Install a root-owned /usr/local/bin/hermes wrapper so admins can run `hermes`
# too. It always drops to the service account (runuser as root, sudo otherwise),
# so root never executes the code the service account can write to.
# hermes_agent_system_symlink is the pre-wrapper name of this switch.
hermes_agent_system_command: "{{ hermes_agent_system_symlink | default(true) }}"

# Secrets written to ~/.hermes/.env (mode 0600). Keep the real values in an
# Ansible Vault file, e.g. OPENROUTER_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_ALLOWED_USERS.
hermes_agent_env: {}
# When true the .env file is replaced with exactly hermes_agent_env; when false
# keys are merged into whatever `hermes config set` / the setup wizard wrote.
hermes_agent_env_exclusive: false

# Non-secret settings merged (recursively) into ~/.hermes/config.yaml.
# Example:
#   hermes_agent_config:
#     model:
#       provider: openrouter
#       default: anthropic/claude-opus-5
hermes_agent_config: {}

# Messaging gateway as a boot-time systemd *system* service running as the
# service account. The unit is generated by Hermes' own code running as the
# service account, checked, and installed by root — root never runs Hermes.
hermes_agent_gateway_enabled: true
hermes_agent_gateway_service_name: hermes-gateway
hermes_agent_gateway_state: started
hermes_agent_gateway_unit_path: "/etc/systemd/system/{{ hermes_agent_gateway_service_name }}.service"

# systemd sandboxing applied through a root-owned drop-in. The gateway keeps
# read-write access to the service account's home (code, runtime, ~/.hermes);
# everything else is read-only. Add or override single directives through
# hermes_agent_gateway_hardening_extra (merged on top), e.g.
#   hermes_agent_gateway_hardening_extra:
#     ReadWritePaths: "/home/hermes /srv/data"
# or set hermes_agent_gateway_hardening_enabled: false to drop the drop-in.
hermes_agent_gateway_hardening_enabled: true
hermes_agent_gateway_hardening_extra: {}
hermes_agent_gateway_hardening:
  NoNewPrivileges: "yes"
  CapabilityBoundingSet: ""
  AmbientCapabilities: ""
  PrivateTmp: "yes"
  ProtectSystem: strict
  ReadWritePaths: "{{ ([hermes_agent_home, hermes_agent_hermes_home] | unique) | join(' ') }}"
  ProtectKernelTunables: "yes"
  ProtectKernelModules: "yes"
  ProtectKernelLogs: "yes"
  ProtectControlGroups: "yes"
  ProtectClock: "yes"
  ProtectHostname: "yes"
  RestrictSUIDSGID: "yes"
  RestrictRealtime: "yes"
  LockPersonality: "yes"
  SystemCallArchitectures: native

# .env values matching this pattern are written bare; anything else is JSON-quoted.
hermes_agent_env_plain_pattern: '^[A-Za-z0-9_./:@,+=-]*$'
