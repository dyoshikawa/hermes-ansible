---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
          # gitleaks scans the whole history
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          experimental: true

      - name: Install Ansible and linters
        run: mise run install

      - name: Scan for leaked secrets
        run: mise run secrets

      - name: Run yamllint and ansible-lint
        run: mise run lint

      - name: Syntax-check the playbook
        run: mise run syntax

  provision:
    name: Provision ${{ matrix.os }}
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          experimental: true

      - name: Install Ansible
        run: mise run install

      # The runner is itself an Ubuntu LTS box with systemd and passwordless
      # sudo, so the playbook provisions it exactly like a VPS.
      - name: Run the playbook against the runner
        run: uv run ansible-playbook -i tests/inventory.yml site.yml

      - name: Run the playbook again and require no changes
        run: |
          uv run ansible-playbook -i tests/inventory.yml site.yml | tee second-run.log
          grep -E 'localhost\s+: ok=[0-9]+\s+changed=0 ' second-run.log

      - name: Verify the install
        run: |
          sudo -u hermes -H hermes --version
          # /usr/local/bin/hermes is a root-owned wrapper, not a link into the
          # checkout, and running it as root drops to the service account.
          test ! -L /usr/local/bin/hermes
          test "$(stat -c '%U:%G %a' /usr/local/bin/hermes)" = 'root:root 755'
          sudo hermes --version
          sudo test -f /home/hermes/.hermes/.env
          sudo grep -q '^OPENROUTER_API_KEY=sk-or-ci-placeholder$' /home/hermes/.hermes/.env
          sudo grep -q '^HERMES_CI_QUOTED="value with spaces # and hash"$' /home/hermes/.hermes/.env
          sudo -u hermes -H hermes config get model.default | grep -qx 'anthropic/claude-opus-5'
          # The messaging extra landed in PM's dependency environment.
          root=/home/hermes/.hermes/hermes-agent
          py=$(sudo -u hermes -H "$root/.hermes/bin/hermes" --print-runtime-command \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)[0])')
          sudo -u hermes -H "$py" -I -c \
            'import sys; sys.path.insert(0, sys.argv[1]); import hermes_bootstrap, telegram' "$root"

      - name: Verify the gateway service
        run: |
          systemctl is-enabled hermes-gateway
          systemctl is-active hermes-gateway
          grep -q '^User=hermes$' /etc/systemd/system/hermes-gateway.service
          grep -q 'HERMES_HOME=/home/hermes/.hermes' /etc/systemd/system/hermes-gateway.service
          test "$(stat -c '%U:%G' /etc/systemd/system/hermes-gateway.service)" = 'root:root'
          grep -qx 'User=hermes' /etc/systemd/system/hermes-gateway.service.d/10-ansible-identity.conf
          test "$(systemctl show -p User --value hermes-gateway)" = hermes
          test "$(systemctl show -p NoNewPrivileges --value hermes-gateway)" = yes
          test "$(systemctl show -p ProtectSystem --value hermes-gateway)" = strict
          test -f /var/lib/systemd/linger/hermes
          # Still up after the handler restarts, i.e. it does not crash-loop under the sandbox.
          sleep 15
          systemctl is-active hermes-gateway
          test "$(systemctl show -p NRestarts --value hermes-gateway)" = 0
          sudo -u hermes -H git -C /home/hermes/.hermes/hermes-agent rev-parse HEAD \
            | grep -qx "$(grep -E '^hermes_agent_commit:' roles/hermes_agent/defaults/main.yml | awk '{print $2}')"

      # Regression: hermes_agent_user_groups is authoritative, so a group that
      # is no longer listed (e.g. a revoked docker grant) is removed, and the
      # gateway still running with it is restarted without it.
      - name: Revoke a group dropped from hermes_agent_user_groups
        run: |
          adm_gid=$(getent group adm | cut -d: -f3)
          gateway_groups() {
            pid=$(systemctl show -p MainPID --value hermes-gateway)
            sudo awk '/^Groups:/ { for (i = 2; i <= NF; i++) print $i }' "/proc/$pid/status"
          }
          sudo usermod -a -G adm hermes
          sudo systemctl restart hermes-gateway
          gateway_groups | grep -qx "$adm_gid"
          uv run ansible-playbook -i tests/inventory.yml site.yml
          if id -nG hermes | tr ' ' '\n' | grep -qx adm; then
            echo "hermes is still in adm after the play" >&2
            exit 1
          fi
          if gateway_groups | grep -qx "$adm_gid"; then
            echo "the gateway still runs with adm after the play" >&2
            exit 1
          fi

      # Regression: --diff must not print bytes the service account wrote
      # into ~/.hermes (terminal escape sequences) to the operator's terminal.
      # .ansible-extras stands in for every such write; changing it also
      # re-runs the extras install, which is expected here.
      - name: Keep service-account bytes out of --diff output
        env:
          ANSIBLE_NOCOLOR: "1"
        run: |
          printf 'messaging 0\033]0;HERMES-CI\007\n' \
            | sudo -u hermes tee /home/hermes/.hermes/.ansible-extras >/dev/null
          uv run ansible-playbook -i tests/inventory.yml site.yml --diff > diff-run.log \
            || { cat -v diff-run.log; exit 1; }
          if grep -q "$(printf '\033')" diff-run.log; then
            cat -v diff-run.log
            echo "--diff output contains an escape character" >&2
            exit 1
          fi
          if grep -q 'HERMES-CI' diff-run.log; then
            cat -v diff-run.log
            echo "--diff output contains the planted file content" >&2
            exit 1
          fi

      - name: Show the gateway log
        if: always()
        run: |
          systemctl status hermes-gateway --no-pager || true
          sudo journalctl -u hermes-gateway --no-pager -n 100 || true
          sudo cat /home/hermes/.hermes/logs/gateway.log 2>/dev/null | tail -n 100 || true
